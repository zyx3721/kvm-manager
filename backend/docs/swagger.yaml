        method、headers、webhookProblemPayload、webhookRecoveryPayload；邮件需要 smtpHost、smtpPort、username、password、from、to，可选
        fromName、useTLS、startTLS、allowInsecureAuth、problemTemplate、recoveryTemplate、problemSubjectTemplate、recoverySubjectTemplate、emailContentType、sendRecovery
        且 TLS 与 STARTTLS 不能同时启用；邮件 to 仅用于告警和恢复通知，找回密码验证码发送到账号配置邮箱；allowInsecureAuth
