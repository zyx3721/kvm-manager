  /api/vms/{id}/migrate:
    post:
      consumes:
      - application/json
      description: 创建后台任务迁移虚拟机。前端默认勾选复制本地磁盘，并要求结构化预检通过后才启用迁移按钮。正式迁移提交只做请求格式、虚拟机、源目标
        Agent、迁移方式和 URI 格式等基础校验，不重复执行完整远程预检，排队后由源 Agent 执行迁移并反馈最终结果。热迁移复制本地磁盘时，源 Agent
        先通过 SSH 按源磁盘原路径复制磁盘，再执行 virsh migrate --live --unsafe，并按请求追加 --persistent、--auto-converge
        和 --postcopy；热迁移未复制磁盘时按共享存储迁移并可追加 --undefinesource。冷迁移未复制磁盘时仍走共享存储迁移；冷迁移复制本地磁盘时由源
        Agent 通过 SSH 复制磁盘、重写 XML 并远程 virsh define。复制本地磁盘并勾选迁移后清理源虚拟机时，成功后会删除源定义和源普通磁盘；共享存储迁移只取消源定义，不删除磁盘。
      parameters:
      - description: 虚拟机 ID
        in: path
        name: id
        required: true
        type: string
      - description: 虚拟机迁移配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.vmMigrateDocRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/router.vmAsyncTaskDocResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/router.errorResponse'
      security:
      - BearerAuth: []
      summary: 迁移虚拟机
      tags:
      - realtime
