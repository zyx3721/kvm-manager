    get:
      description: 查询宿主机 CPU、内存、存储和虚拟机数量趋势。agentId=all 时聚合全部宿主机。range 支持 1h、24h、7d、30d
        和 custom。自定义时间范围需要传入分钟精度或 RFC3339 格式的 start 和 end。
      parameters:
      - description: Agent ID 或 all
        in: path
        name: agentId
        required: true
        type: string
      - default: 1h
        description: 趋势时间范围
        enum:
        - 1h
        - 24h
        - 7d
        - 30d
        - custom
        in: query
        name: range
        type: string
      - description: 自定义开始时间，例如 2026-05-23T10:00
        in: query
        name: start
        type: string
      - description: 自定义结束时间，例如 2026-05-23T12:00
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.metricSeriesDocResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.errorResponse'
      security:
      - BearerAuth: []
      summary: 查询宿主机指标趋势
      tags:
      - realtime
