      tags:
      - realtime
    post:
      consumes:
      - application/json
      description: 创建后台任务，在指定宿主机 Agent 上创建虚拟机。常规模式会创建系统盘卷，调用 virt-install 生成 XML 后通过
        virsh define 定义虚拟机，并校验最大 CPU、最大内存不超过宿主机资源；后端仍兼容 createMode=template 的旧磁盘模板创建模式，会从已有
        qcow2、img、raw、qcow 或 qed 模板磁盘克隆系统盘到目标卷名，再按导入磁盘方式定义虚拟机；XML 模式可直接提交完整 libvirt
        XML，后端和 Agent 会从 XML name 读取虚拟机名称，并校验宿主机、XML 非空、XML 可解析以及名称不重复。当前前端模板菜单使用
        /api/vms/{id}/template-create 从已标记的虚拟机模板创建。常规和旧磁盘模板模式支持 CPU/内存、操作系统类型、ISO
        镜像、ISO 总线类型、网络池、VNC 控制台、控制台密码、创建后直接启动和固件配置；未选择 ISO 镜像时仍会按 isoBus 创建空 CDROM
        设备。任务完成后后端先执行 fast 同步并广播 runtime.updated，让新虚拟机尽快出现在列表中，随后后台延迟 full 同步补齐重字段。
