        libvirt XML 后执行 virsh define；网卡优先按 MAC 匹配，Agent 会根据目标网络池切换 interface type
        与 source 属性；已有磁盘只允许扩容不允许缩容；删除磁盘会从 XML 移除普通 disk 设备并删除对应存储卷，且至少保留一块磁盘。
