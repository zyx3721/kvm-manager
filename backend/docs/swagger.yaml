  /api/vms/{id}/migrate-precheck:
    post:
      consumes:
      - application/json
      description: 返回结构化迁移预检清单，不创建后台任务；这是完整远程迁移预检入口。预检项包括源 VM 状态、目标同名虚拟机、目标 CPU/内存容量、基础
        CPU 架构、网络池/桥接设备、共享存储或目标存储路径和迁移通道；勾选复制本地磁盘时会检查目标宿主机是否存在每块源磁盘路径所在的存储池，并检查目标池中是否已存在同路径或同名磁盘卷，同时要求
        qemu+ssh:// 迁移 URI；未勾选复制本地磁盘时检查源目标存储池是否显示共享存储特征；仅当迁移 URI 以 qemu+ssh:// 开头时检测
        SSH 非交互通道，其他 URI 返回跳过项。
      parameters:
      - description: 虚拟机 ID
        in: path
        name: id
        required: true
        type: string
      - description: 虚拟机迁移配置
        in: body
